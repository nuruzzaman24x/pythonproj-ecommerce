apiVersion: v1                                        # core API version
kind: Service                                         # a network door to the controller metrics
metadata:                                             # name and place
  name: ingress-nginx-controller-metrics              # metrics service name
  namespace: ingress-nginx                            # same namespace as the controller
  labels:                                             # label used by the ServiceMonitor
    app.kubernetes.io/name: ingress-nginx-metrics     # which component this is
spec:                                                 # how the service works
  type: ClusterIP                                     # only reachable inside the cluster
  ports:                                              # open ports
    - name: metrics                                   # port name
      port: 10254                                     # controller metrics port
      targetPort: 10254                               # same port on the pod
  selector:                                           # send traffic to the controller pods
    app.kubernetes.io/component: controller           # controller pod
    app.kubernetes.io/instance: ingress-nginx         # same instance
    app.kubernetes.io/name: ingress-nginx             # same app
---
apiVersion: monitoring.coreos.com/v1                  # prometheus operator API version
kind: ServiceMonitor                                  # tells prometheus what to scrape
metadata:                                             # name and place
  name: ingress-nginx                                 # servicemonitor name
  namespace: monitoring                               # same namespace as prometheus
spec:                                                 # how it works
  namespaceSelector:                                  # where to look for the service
    matchNames:                                       # list of namespaces
      - ingress-nginx                                 # the controller namespace
  selector:                                           # which service to scrape
    matchLabels:                                      # match by labels
      app.kubernetes.io/name: ingress-nginx-metrics   # the service above
  endpoints:                                          # scrape settings
    - port: metrics                                   # the port name above
      interval: 15s                                   # scrape every 15 seconds
      honorLabels: true                               # keep the metric's own namespace/service labels, do not overwrite them
