apiVersion: autoscaling/v2                            # HPA API version
kind: HorizontalPodAutoscaler                         # automatically changes the number of pods
metadata:                                             # name and place
  name: django                                        # hpa name
  namespace: ecommerce-python                         # same namespace as the app
  labels:                                             # standard labels
    app.kubernetes.io/name: django                    # which component this is
    app.kubernetes.io/part-of: ecommerce-python       # which project this belongs to
spec:                                                 # how the hpa works
  scaleTargetRef:                                     # what to scale
    apiVersion: argoproj.io/v1alpha1                  # Argo Rollouts API version
    kind: Rollout                                     # scale the Rollout, not a Deployment
    name: django                                      # rollout name
  minReplicas: 3                                      # never go below 3 pods
  maxReplicas: 6                                      # never go above 6 pods
  metrics:                                            # what to measure
    - type: Resource                                  # pod resource usage
      resource:                                       # resource settings
        name: cpu                                     # measure cpu
        target:                                       # target value
          type: Utilization                           # percent of the cpu request (100m)
          averageUtilization: 70                      # add pods when average cpu is above 70m per pod
  behavior:                                           # how fast to scale
    scaleUp:                                          # adding pods
      stabilizationWindowSeconds: 0                   # scale up immediately
      policies:                                       # scale up rules
        - type: Pods                                  # change by a number of pods
          value: 2                                    # add at most 2 pods
          periodSeconds: 60                           # every 60 seconds
    scaleDown:                                        # removing pods
      stabilizationWindowSeconds: 300                 # wait 5 minutes before removing pods
      policies:                                       # scale down rules
        - type: Pods                                  # change by a number of pods
          value: 1                                    # remove at most 1 pod
          periodSeconds: 60                           # every 60 seconds
